# Configuración de la zona. Otra brigada puede copiar este archivo y cambiar
# solo estos valores para vigilar su propia sierra.

[zona]
nombre = "Ciénega de González"
slug = "cienega-de-gonzalez"
zona_horaria = "America/Monterrey"
# Área del mapa (grados decimales)
oeste = -100.58
sur = 25.26
este = -100.16
norte = 25.46
# Enlace a la página con el mapa (opcional)
url_herramienta = ""

# Lugares que se vigilan. Se avisa si hay fuego dentro de radio_km.
[[puntos]]
nombre = "Ciénega de González"
lat = 25.37876
lon = -100.23701
radio_km = 10

# Para agregar otro lugar, copia el bloque:
# [[puntos]]
# nombre = "Otro poblado"
# lat = 0.0
# lon = 0.0
# radio_km = 8

[senderos]
# GeoJSON con LineString o MultiLineString y propiedad "name".
# senderos.geojson trae los caminos de OpenStreetMap de la zona.
archivos = ["senderos.geojson"]

[alerta]
sendero_fuego_km = 0.4   # "tramo con fuego": a 400 m o menos
sendero_cerca_km = 2.0   # "cerca del sendero": a 2 km o menos
margen_km = 10           # cuánto se amplía el área al consultar FIRMS
consultar_viento = true  # agrega viento actual (Open-Meteo) al mensaje
archivo_estado = "estado.json"

[firms]
dias = 1
fuentes = ["VIIRS_NOAA20_NRT", "VIIRS_NOAA21_NRT", "VIIRS_SNPP_NRT", "MODIS_NRT"]
